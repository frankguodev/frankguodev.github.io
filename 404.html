<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Page Not Found · Frank Guo</title>
  <meta name="description" content="The requested page could not be found. Return to Frank Guo's AI practice, personal branding, and GitHub entry point.">
  <link rel="canonical" href="https://frankguo.dev/404.html">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    :root {
      --canvas: #ffffff;
      --canvas-subtle: #f6f8fa;
      --border: #d0d7de;
      --fg: #24292f;
      --muted: #57606a;
      --accent: #0969da;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: var(--canvas-subtle);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(100% - 32px, 720px);
      padding: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--canvas);
    }

    img {
      width: 64px;
      height: 64px;
      border-radius: 12px;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: 32px;
      line-height: 1.2;
    }

    p {
      margin: 0 0 22px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--accent);
      font-weight: 650;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      border-color: #8c959f;
      text-decoration: none;
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <img src="/frankguo-fg-logo.svg" alt="" width="64" height="64">
    <h1>Page not found</h1>
    <p>This page does not exist, or it may have moved while the site is still evolving.</p>
    <div class="actions">
      <a href="/">Go home</a>
      <a href="/zh/" hreflang="zh-CN" lang="zh-CN">中文首页</a>
      <a href="https://github.com/frankguodev" rel="me">GitHub</a>
    </div>
  </main>
</body>
</html>
